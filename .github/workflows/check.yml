name: check-schedule
on:
  pull_request:
  push:
    paths: ["schedule.yaml", "videos/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml && python validate.py
